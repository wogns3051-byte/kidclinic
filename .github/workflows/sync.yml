name: 소아과 데이터 갱신

# 심평원 API 가 해외(GitHub) 접속을 막아서 자동 실행은 끔. 갱신은 내 PC 의 작업 스케줄러가 담당.
# (나중에 접속이 풀리면 아래 schedule 두 줄 앞의 # 를 지우면 다시 자동 실행됨)
on:
  # schedule:
  #   - cron: '7 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 자체 검사
        run: node sync/test.js
      - name: 심평원 데이터 받기
        run: node sync/sync.js
        env:
          HIRA_SERVICE_KEY: ${{ secrets.HIRA_SERVICE_KEY }}
          DETAIL_DAILY_LIMIT: ${{ vars.DETAIL_DAILY_LIMIT || '900' }}
          HIRA_LIST_URL: ${{ vars.HIRA_LIST_URL }}
          HIRA_DETAIL_URL: ${{ vars.HIRA_DETAIL_URL }}
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "데이터 갱신 $(date -u +%F)" && git push; fi
