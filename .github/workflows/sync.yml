name: 소아과 데이터 갱신

on:
  schedule:
    - cron: '7 19 * * *'   # 매일 한국시간 새벽 4시 7분
  workflow_dispatch:        # Actions 탭에서 "Run workflow" 로 바로 실행

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 자체 검사
        run: node sync/test.js
      - name: 심평원 데이터 받기
        run: node sync/sync.js
        env:
          HIRA_SERVICE_KEY: ${{ secrets.HIRA_SERVICE_KEY }}
          DETAIL_DAILY_LIMIT: ${{ vars.DETAIL_DAILY_LIMIT || '900' }}
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "데이터 갱신 $(date -u +%F)" && git push; fi
